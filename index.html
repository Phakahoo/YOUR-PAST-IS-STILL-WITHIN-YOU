<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>อดีตของคุณยังอยู่ในตัวคุณ · Your Past Is Still Within You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&family=Noto+Sans+Thai:wght@400;500&family=Noto+Serif+Thai:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>document.documentElement.classList.add('js')</script>
</head>
<body>
<header class="top">
  <span class="brand" data-i18n="brand">A JOURNEY THROUGH HERITAGE</span>
  <div class="lang" role="group" aria-label="Language / ภาษา">
    <button type="button" data-lang="th" aria-pressed="true">TH</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>
</header>

<main>
  <section id="landing" class="stage" aria-labelledby="t-land">
    <p class="eyebrow" data-i18n="brand">A JOURNEY THROUGH HERITAGE</p>
    <h1 id="t-land" data-i18n="title"></h1>
    <span class="accent"></span>
    <p class="lead" data-i18n="support"></p>
    <button type="button" class="btn" id="start"><span data-i18n="start"></span><i aria-hidden="true">→</i></button>
    <span class="folio" aria-hidden="true">MMXXVI</span>
  </section>

  <section id="intro" class="stage" aria-labelledby="t-intro" hidden>
    <p class="eyebrow" data-i18n="introEyebrow"></p>
    <h2 id="t-intro" data-i18n="introTitle"></h2>
    <span class="accent"></span>
    <p class="lead" data-i18n="introText"></p>
    <button type="button" class="btn" id="begin"><span data-i18n="begin"></span><i aria-hidden="true">→</i></button>
  </section>

  <section id="quiz" class="stage" aria-labelledby="qText" hidden>
    <div class="qhead">
      <p class="eyebrow" id="qLabel"></p>
      <p class="count" id="qCount" aria-live="polite"></p>
    </div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="4" id="bar"><span id="barFill"></span></div>
    <div id="qBody">
      <h2 id="qText" class="qtext"></h2>
      <div id="answers" role="radiogroup" aria-labelledby="qText"></div>
    </div>
    <div class="nav">
      <button type="button" class="link" id="back"></button>
      <button type="button" class="btn" id="next" disabled><span id="nextLbl"></span><i aria-hidden="true">→</i></button>
    </div>
  </section>

  <section id="result" hidden>
    <div class="stage resintro">
      <p class="eyebrow" data-i18n="resEyebrow"></p>
      <h2 id="resName" tabindex="-1"></h2>
      <span class="accent"></span>
      <p class="lead" id="resDesc"></p>
      <button type="button" class="cue" id="cue"><span data-i18n="cue"></span><b aria-hidden="true"></b></button>
    </div>

    <article id="costume" class="feature" aria-labelledby="cName">
      <figure class="plate rv">
        <img id="cImg" alt="" decoding="async">
        <div class="imgerr" id="imgErr" role="alert" hidden></div>
        <figcaption id="cCap"></figcaption>
      </figure>
      <div class="copy">
        <p class="eyebrow rv" data-i18n="costumeLabel"></p>
        <h3 id="cName" class="rv"></h3>
        <span class="rule rv"></span>
        <p class="lead rv" id="cDesc"></p>
        <dl class="details rv" id="cDetails"></dl>
        <div class="rv actions">
          <button type="button" class="btn" id="view"><span data-i18n="view"></span><i aria-hidden="true">→</i></button>
          <button type="button" class="link" id="restart" data-i18n="restart"></button>
        </div>
      </div>
    </article>
  </section>
</main>

<div class="modal" id="modal" hidden>
  <div class="backdrop" id="backdrop"></div>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="mName">
    <button type="button" class="close" id="close">×</button>
    <img id="mImg" alt="">
    <div class="imgerr" id="mErr" hidden></div>
    <p id="mName"></p>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
